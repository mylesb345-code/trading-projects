# Box-theory scanner (box-scanner/): stock scan at 9:40 AM New York on trading days, after the opening rush.
# It reads yesterday's completed candles, re-checks each setup at the live price, then places PAPER bracket orders.
# Uses the ALPACA_API_KEY / ALPACA_SECRET_KEY repository secrets; alerts go to the same ntfy channel as the
# other bots. Its memory (signals already handled, order log) is saved back to box-scanner/state/.
name: box-scanner

on:
  # schedule removed 2026-11-02: day trading only (orb-bot/); the box scanner's last positions were sold
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trading-bot  # never at the same time as the other jobs, so their saves can't clash
  cancel-in-progress: false

env:
  NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}  # phone-alert channel, kept secret so the public repo does not reveal it

jobs:
  stocks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Restore the candle cache
        uses: actions/cache@v4
        with:
          path: box-scanner/cache
          key: box-bars-${{ github.run_id }}
          restore-keys: box-bars-

      - name: Install packages
        run: python3 -m pip install --quiet -r box-scanner/requirements.txt

      - name: Scan stocks and trade (paper)
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_DATA_FEED: iex
        run: |
          cd box-scanner && python3 main.py scan stocks --trading-days-only --market-open-only

      - name: Save the scanner's memory
        if: always()
        run: |
          git config user.name "trading-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f box-scanner/state/scanner.sqlite ] && git add -f box-scanner/state/scanner.sqlite
          if git diff --cached --quiet; then
            echo "Nothing new to save."
          else
            git commit -m "Box scanner run $(date -u '+%Y-%m-%d')"
            git pull --rebase
            git push
          fi
