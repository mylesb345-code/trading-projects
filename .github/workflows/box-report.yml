# Daily win/loss report for the Alpaca paper account (box-scanner/report.py), pushed to your phone after the close.
name: box-report

on:
  # schedule removed 2026-11-02: box theory no longer opens trades; trend-bot/ sends the Friday summary
  workflow_dispatch:

permissions:
  contents: read

env:
  NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}  # phone-alert channel, kept secret so the public repo does not reveal it

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install packages
        run: python3 -m pip install --quiet -r box-scanner/requirements.txt

      - name: Build and send the report
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_DATA_FEED: iex
        run: |
          cd box-scanner && python3 main.py report
