# Opening-range breakout day trader (orb-bot/) on the Alpaca PAPER account: enters QQQ around 9:35 AM New York with a
# bracket (stop + target) order and closes at 3:55 PM. Each pair of times covers summer and winter time; the run that
# falls outside its New York window exits in seconds, and a repeat morning run finds today's order and does nothing.
# Extra-session paper test (orb-bot/sessions.py): "early" (pre-open + London, started ~3:50 AM New York by
# cron-job.org) and "late" (after-hours, started by the close run below). Each watches the price for hours.
name: orb-bot

on:
  schedule:
    - cron: "20 13,14 * * 1-5"  # morning: 9:20 AM New York (summer 13:20 UTC, winter 14:20 UTC)
    - cron: "30 19,20 * * 1-5"  # close: 3:30 PM New York (summer 19:30 UTC, winter 20:30 UTC)
  workflow_dispatch:
    inputs:
      command:
        description: "morning, close, early or late"
        required: true
        default: morning

permissions:
  contents: read
  actions: write  # the close run starts the after-hours session run

concurrency:
  group: orb-bot-${{ (inputs.command == 'early' || inputs.command == 'late') && inputs.command || 'main' }}
  cancel-in-progress: false

env:
  NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}  # phone-alert channel, kept secret so the public repo does not reveal it

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.command == 'early' && 350 || inputs.command == 'late' && 300 || 90 }}
    steps:
      - uses: actions/checkout@v5

      - name: Install packages
        run: python3 -m pip install --quiet -r box-scanner/requirements.txt

      - name: Day trade (paper)
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          SCHEDULE: ${{ github.event.schedule }}
          COMMAND: ${{ inputs.command }}
        run: |
          case "$SCHEDULE" in
            "20 13,14 * * 1-5") COMMAND=morning ;;
            "30 19,20 * * 1-5") COMMAND=close ;;
          esac
          case "$COMMAND" in
            early|late) python3 orb-bot/sessions.py "$COMMAND" ;;
            *) python3 orb-bot/bot.py "$COMMAND" ;;
          esac

      - name: Start the after-hours session run
        if: always() && (inputs.command == 'close' || github.event.schedule == '30 19,20 * * 1-5')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run orb-bot.yml --ref main -f command=late  # exits at once unless it's ~3:30-4:30 PM New York
