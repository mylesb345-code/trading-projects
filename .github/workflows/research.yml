# Re-runs the strategy research every day on fresh data and sends a short "Daily research" digest to your phone.
# A market joins or leaves the live signals only after 5 daily passes or fails in a row; the swing bot
# (trading-bot/bot.py) picks up the list on its next hourly check.
name: research

on:
  schedule:
    - cron: "40 0 * * *"  # 00:40 UTC daily, just after the daily candle closes (8:40 PM New York)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trading-bot  # never runs at the same time as the hourly bot, so their saves can't clash
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Test every rule on every market (paper research)
        run: python3 research/research.py --notify

      - name: Save the results
        run: |
          git config user.name "trading-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/REPORT.md research/results.csv research/selected.json research/streaks.json
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Daily research $(date -u '+%Y-%m-%d')"
            git pull --rebase
            git push
          fi
